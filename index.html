<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Verification</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#1d1d1d;color:#f5f5f5;font-family:Arial,sans-serif}
main{width:min(680px,100%);text-align:center}
.brand{background:#07568c;border-radius:18px;padding:22px;color:white;font-size:clamp(26px,6vw,44px);font-weight:700}
.tag{display:inline-block;margin:24px 0 8px;padding:8px 14px;border:2px solid #ffcc55;border-radius:8px;color:#ffdf8a;font-weight:700;letter-spacing:1px}
.status{color:#7df18a;font-size:clamp(28px,6vw,44px);font-weight:700;margin:12px 0 26px}
.meta{color:#c7c7c7;font-size:18px;line-height:1.9}
.name{font-size:clamp(24px,5vw,38px);font-weight:800;line-height:1.25;margin:30px 0;overflow-wrap:anywhere}
.note{margin-top:28px;color:#ffdf8a;font-size:14px;line-height:1.5}
</style>
</head>
<body>
<main>
  <div class="brand">DEMO VERIFICATION</div>
  <div class="tag">SAMPLE • NOT OFFICIAL</div>
  <div class="status">✓ Demo record displayed</div>
  <div class="meta">Issue date: 2026-11-13<br>Demo ID: DEMO-2026-001</div>
  <div class="name">Name: MUHAMMAD ABUBAKKAR NADEEM</div>
  <p class="note">This is a demonstration only. It is not a medical report, certificate, or confirmation from any hospital, clinic, or authority.</p>
</main>
</body>
</html>
